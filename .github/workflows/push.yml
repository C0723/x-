name: Checkout repository
  uses: actions/checkout@v4
name: x-push
on:
  schedule:
    # 每 10 分钟一次。GitHub 的 cron 用 UTC，且可能延迟几分钟。
    - cron: "*/10 * * * *"
  workflow_dispatch: # 允许在网页上手动点一次，方便测试
permissions:
  contents: write # 需要写回 state.json / archive.md
concurrency:
  group: x-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取并推送
        env:
          X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          RSS_URL: ${{ secrets.RSS_URL }}
        run: python check.py
      - name: 保存进度
        run: |
          git config user.name "x-push-bot"
          git config user.email "x-push-bot@users.noreply.github.com"
          git add state.json archive.md 2>/dev/null || true
          if git diff --quiet --cached; then
            echo "没有变化，跳过提交"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git push && break
              sleep 3
              git pull --rebase --autostash
            done
          fi
