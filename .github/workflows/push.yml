name: x-push
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: x-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run
        env:
          X_SCREEN_NAME: ${{ secrets.X_SCREEN_NAME }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          QMSG_KEY: ${{ secrets.QMSG_KEY }}
          RSS_URL: ${{ secrets.RSS_URL }}
        run: python check.py
      - name: save
        run: |
          git config user.name "x-push-bot"
          git config user.email "x-push-bot@users.noreply.github.com"
          git add state.json archive.md 2>/dev/null || true
          if git diff --quiet --cached; then
            echo "no change"
          else
            git commit -m "state: $(date -u +%FT%TZ)"
            for i in 1 2 3; do
              git push && break
              sleep 3
              git pull --rebase --autostash
            done
          fi
